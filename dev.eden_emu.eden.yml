app-id: dev.eden_emu.eden
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: eden-launcher

finish-args:
  - --device-if=all:!has-input-device
  - --device=dri
  - --device=input
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --filesystem=xdg-run/app/com.discordapp.Discord:ro

modules:
  - name: eden
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      strip: true
      no-debuginfo: true
      arch:
      #These are duplicated because in testing, global flags are overridden by these unless explicitly set.
      #Explanation of each:
        #march tells compiler what cpu instructions allowed
        #mtune helps it predict better for common devices within that set
        #Flto: sets up link time optimization, increasing runtime at cost of slower compiling. Balanced out by lld
        #O3: allows more optimizations, at cost of slightly less stability, which for this level of cpu usage is a must
        #pipe speeds up compiling, at cost of more memory usage.
        x86_64:
          cflags: -march=x86-64-v3 -mtune=generic -flto=thin -O3 -pipe -fprofile-instr-use=/run/build/eden/eden.profdata -fstrict-vtable-pointers -fno-asynchronous-unwind-tables -fmerge-all-constants -ffunction-sections -fdata-sections -fno-trapping-math -fno-math-errno -fomit-frame-pointer -fno-plt -fno-rtti -fno-exceptions -fstrict-aliasing
          cxxflags: -march=x86-64-v3 -mtune=generic -flto=thin -O3 -pipe -fprofile-instr-use=/run/build/eden/eden.profdata -fno-trapping-math -fno-math-errno -fomit-frame-pointer -fno-plt -fno-rtti -fno-exceptions -fstrict-aliasing
          #Ldflags are a deviation from upstream that result in smaller filesize.
          #Gc-sections 
          ldflags: -Wl,--icf=safe, -Wl,-O3 -Wl,--gc-sections -fuse-ld=lld -flto -fno-plt
        aarch64:
          cflags: -march=armv8-a -mtune=generic -flto=thin -O3 -pipe -fprofile-instr-use=/run/build/eden/eden.profdata -fstrict-vtable-pointers -fno-asynchronous-unwind-tables -fmerge-all-constants -ffunction-sections -fdata-sections -fno-trapping-math -fno-math-errno -fomit-frame-pointer -fno-plt -fno-rtti -fno-exceptions -fstrict-aliasing
          cxxflags: -march=armv8-a -mtune=generic -flto=thin -O3 -pipe -fprofile-instr-use=/run/build/eden/eden.profdata -fno-trapping-math -fno-math-errno -fomit-frame-pointer -fno-plt -fno-rtti -fno-exceptions -fstrict-aliasing
          ldflags: -Wl,--icf=safe, -Wl,-O3 -Wl,--gc-sections -fuse-ld=lld -flto -fno-plt
      env:
        AR: llvm-ar
        CC: clang
        CXX: clang++
        RANLIB: llvm-ranlib
    config-opts:
      #Self-explanatory, disables testing because this isn't a test
      - -DBUILD_TESTING=OFF
      #Ditto, we releasing a release
      - -DCMAKE_BUILD_TYPE=Release
      #Using bundled stuff this way breaks the flatpak, so it is not used in favor of runtime stuff.
      - -DYUZU_USE_BUNDLED_QT=OFF
      - -DYUZU_USE_QT_MULTIMEDIA=OFF
      - -DYUZU_USE_QT_WEB_ENGINE=OFF
      - -DENABLE_QT_TRANSLATION=ON
      #Flatpak handles update, not itself. (Because not AppImage)
      - -DENABLE_UPDATE_CHECKER=OFF
      #Discord.
      - -DUSE_DISCORD_PRESENCE=ON
      #Seemingly enables LTO friendly stuff in eden, combining with -flto=thin to make it faster runtime at cost of compile speed
      - -DENABLE_LTO=ON
      - -DYUZU_USE_BUNDLED_SIRIT=OFF
      - -DYUZU_USE_BUNDLED_FFMPEG=OFF
      - -DYUZU_USE_BUNDLED_OPENSSL=OFF
      - -DYUZU_DISABLE_LLVM=ON
      - -DYUZU_STATIC_BUILD=OFF
      - -DYUZU_CMD=OFF
      - -DYUZU_ROOM_STANDALONE=OFF
      - -DNIGHTLY_BUILD=OFF
      - -DYUZU_USE_BUNDLED_SDL2=OFF
      - -DVulkanHeaders_FORCE_BUNDLED=ON
      #Forces linked to lld, which is ideal, again, for speeding up the linking on compile to speedup runtime.
      - -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
      #LDflags is here as well just to be extra sure they are used
      - -LDFLAGS="-Wl,--icf=safe, -Wl,-O3 -Wl,--gc-sections -fuse-ld=lld -flto -fno-plt"
      #should be covered by dbuild testing off, however there is enough evidence that some tests run anyways without these that these are added regardless
      - -DYUZU_TESTS=OFF
      - -DDYNARMIC_TESTS=OFF

    post-install:
      - desktop-file-edit --set-key Exec --set-value eden-launcher /app/share/applications/dev.eden_emu.eden.desktop

    sources:
      - type: git
        url: https://git.eden-emu.dev/eden-emu/eden.git
        tag: v0.2.1
        commit: 58c1e20ee58efa3900ba616207d460886214480b
      - generated-sources.yml
      - type: file
        url: https://github.com/Eden-CI/PGO/releases/download/v020525/eden.profdata
        dest-filename: eden.profdata
        sha256: 777dd9aefb9427ed08a642b02998f32c5ac120e5d32611d8f21cf1f4e68cee57
        # MUST be manually updated when a new release occurs
      

  - name: eden-flatpak
    buildsystem: simple
    build-commands:
      - install -Dm755 eden-launcher.sh /app/bin/eden-launcher
      - install -Dm644 dev.eden_emu.eden.metainfo.xml /app/share/metainfo/dev.eden_emu.eden.metainfo.xml
    sources:
      - type: git
        url: https://github.com/seraphicfae/dev.eden_emu.eden
        tag: c825
        commit: c8253d02e7162e4675cbcfedb0f78a7e7e005606
